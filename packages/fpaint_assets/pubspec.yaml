name: fpaint_assets
version: 1.9.0

publish_to: "none"

description: "Shared assets for fPaint and apps embedding fPaint UI"

environment:
  sdk: ">=3.12.0"
  flutter: ">=3.44.0"

flutter:
  assets:
    - assets/icons/
    - assets/images/
    - assets/images/platforms/
    - assets/app_icon.png
    - assets/test/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.otf
          weight: 400
        - asset: assets/fonts/Inter-Medium.otf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Inter-Bold.otf
          weight: 700
