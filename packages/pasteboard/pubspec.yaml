name: pasteboard
description: Local pasteboard implementation with alpha-preserving Windows PNG clipboard writes.
version: 0.5.0
publish_to: "none"

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      windows:
        pluginClass: PasteboardPlugin
