name: fpaint
description: "A feature-rich drawing and painting application built with Flutter
  that allows users to create digital artwork on any platform - iOS, Android,
  macOS, Windows, Linux, and Web - from a single code base."
# Keywords for SEO and pub.dev (also used for web index.html SEO)
keywords:
  - painting
  - drawing
  - art
  - canvas
  - sketch
  - digital art
  - Flutter
  - cross-platform
  - image editor
  - creative
  - open source
  - fPaint
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

# Repository information
repository: https://github.com/vteam-com/fPaint
homepage: https://github.com/vteam-com/fPaint
issue_tracker: https://github.com/vteam-com/fPaint/issues

version: 1.9.5+1

environment:
  sdk: ">=3.13.2"
  flutter: ">=3.47.2"

dependencies:
  archive: 4.2.0
  desktop_drop: 0.8.4
  file_picker: 12.2.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_svg: 2.3.0
  fpaint_assets:
    path: packages/fpaint_assets
  image: 4.9.2
  intl: 0.20.3
  logging: 1.3.0
  material_ui: 1.2.0
  multi_split_view: 3.6.2
  pasteboard: 0.5.0
  path_provider: 2.1.6
  shared_preferences: 2.5.5
  url_launcher: 6.3.2
  vector_math: 2.4.2
  web: 1.1.1
  xml: 7.0.1

dev_dependencies:
  flutter_launcher_icons: 0.14.4
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter

flutter:
  config:
    enable-swift-package-manager: true

  generate: true

# dart run flutter_launcher_icons
flutter_launcher_icons:
  android: "launcher_icon"
  ios:
    remove_alpha_ios: true
  image_path: "../fpaint_assets/assets/app_icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "packages/fpaint_assets/assets/app_icon.png"
  windows:
    generate: true
    image_path: "packages/fpaint_assets/assets/app_icon.png"
  macos:
    generate: true
    image_path: "packages/fpaint_assets/assets/app_icon.png"
